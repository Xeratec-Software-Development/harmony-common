name: Build and Deploy Harmony Stack

on:
  push:
    branches:
      - harmony-xeratec-internal-c2-and-c3
  workflow_dispatch:
    inputs:
      harmony-common-branch:
        description: 'Branch for harmony-common'
        required: true
        default: 'harmony-xeratec-internal-c2-and-c3'
      harmony-access-point-branch:
        description: 'Branch for harmony-access-point'
        required: true
        default: 'harmony-main-xeratec'  
      harmony-smp-branch:
        description: 'Branch for harmony-smp'
        required: true
        default: 'harmony-main-xeratec'
      dynamic-discovery-client-branch:
        description: 'Branch for dynamic-discovery-client'
        required: true
        default: 'harmony-main-xeratec'

jobs:
  build-and-deploy:
    runs-on: ubuntu-20.04 

    strategy:
      matrix:
        architecture: [amd64] 

    environment: internal

    env:
      C2_VM_HOST: ${{ secrets.C2_VM_HOST }}
      C2_VM_USER: ${{ secrets.C2_VM_USER }}
      C3_VM_HOST: ${{ secrets.C3_VM_HOST }}
      C3_VM_USER: ${{ secrets.C3_VM_USER }}

    steps:
    # ----------- Set Up Java 8 ----------- #
    - name: Set up JDK 8
      uses: actions/setup-java@v3
      with:
        java-version: '8'
        distribution: 'temurin'

    - name: Verify Java Version
      run: java -version

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential devscripts debhelper

    # ----------- Clone All Repositories ----------- #
    - name: Checkout harmony-access-point
      uses: actions/checkout@v3
      with:
        repository: Xeratec-Software-Development/harmony-access-point
        ref: ${{ github.event.inputs.harmony-access-point-branch }}
        path: harmony-access-point

    - name: Checkout harmony-common
      uses: actions/checkout@v3
      with:
        repository: Xeratec-Software-Development/harmony-common
        ref: ${{ github.event.inputs.harmony-common-branch }}
        path: harmony-common

    - name: Checkout harmony-smp
      uses: actions/checkout@v3
      with:
        repository: Xeratec-Software-Development/harmony-smp
        ref: ${{ github.event.inputs.harmony-smp-branch }}
        path: harmony-smp

    - name: Checkout dynamic-discovery-client
      uses: actions/checkout@v3
      with:
        repository: Xeratec-Software-Development/dynamic-discovery-client
        ref: ${{ github.event.inputs.dynamic-discovery-client-branch }}
        path: dynamic-discovery-client

    # ----------- Run Scripts in harmony-common ----------- #
    - name: Run prepare_buildhost.sh (sudo)
      run: |
        cd harmony-common
        chmod +x prepare_buildhost.sh
        sudo ./prepare_buildhost.sh

    - name: Run build_packages.sh -s (skip tests)
      run: |
        cd harmony-common
        chmod +x build_packages.sh
        ./build_packages.sh -s

    - name: Build dynamic-discovery-client (skip tests)
      run: |
        cd dynamic-discovery-client
        ./mvnw clean install -Dmaven.test.skip=true

    - name: get host key
      run: |
       mkdir -p ~/.ssh  # ✅ Ensure .ssh directory exists
        ssh-keyscan -H ${{ secrets.C2_VM_HOST }} >> ~/.ssh/known_hosts
        ssh-keyscan -H ${{ secrets.C3_VM_HOST }} >> ~/.ssh/known_hosts
        chmod 600 ~/.ssh/known_hosts  

    # ----------- Transfer Build Artifacts to C2 and C3 ----------- #
    - name: Copy Build Artifacts to C2 and C3
      run: |
        echo "📦 Packaging build artifacts for deployment..."

        # Use GitHub workspace directory
        mkdir -p "${{ github.workspace }}/test-deploy"

        # Copy dynamic-discovery-client JAR excluding *-sources.jar
        find dynamic-discovery-client/dynamic-discovery-client/target/ -type f -name "dynamic-discovery-client-*.jar" ! -name "*-sources.jar" -exec cp {} "${{ github.workspace }}/test-deploy/" \;

        # Copy harmony-MSH JAR excluding *-sources.jar
        find harmony-access-point/Core/Domibus-MSH/target/ -type f -name "harmony-MSH-*.jar" ! -name "*-sources.jar" -exec cp {} "${{ github.workspace }}/test-deploy/" \;

        ls "${{ github.workspace }}/test-deploy/"

        # SSH Key for C2
        echo "${{ secrets.C2_VM_SSH_KEY }}" > c2_key.pem
        chmod 600 c2_key.pem

        # Copy JARs to C2
        scp -i c2_key.pem "${{ github.workspace }}/test-deploy/"* ${{ secrets.C2_VM_USER }}@${{ secrets.C2_VM_HOST }}:/home/harmony_admin/test-deploy/

        # SSH Key for C3
        echo "${{ secrets.C3_VM_SSH_KEY }}" > c3_key.pem
        chmod 600 c3_key.pem

        # Copy JARs to C3
        scp -i c3_key.pem "${{ github.workspace }}/test-deploy/"* ${{ secrets.C3_VM_USER }}@${{ secrets.C3_VM_HOST }}:/home/harmony_admin/test-deploy/

        # Clean up private keys
        rm -f c2_key.pem c3_key.pem

    - name: Notify Build Success
      run: echo "✅ Build completed successfully. Ready for deployment to C2 and C3."